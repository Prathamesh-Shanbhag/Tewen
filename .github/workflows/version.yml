name: Update Version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type (major, minor, patch)'
        required: true
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install -g semver

      - name: Update Version
        id: update_version
        run: |
          # Read current version
          CURRENT_VERSION=$(grep -o '"version": "[^"]*"' version.json | cut -d'"' -f4)
          echo "Current version: $CURRENT_VERSION"

          # Bump version
          if [ "${{ github.event.inputs.bump }}" == "major" ]; then
            NEW_VERSION=$(semver -i major $CURRENT_VERSION)
          elif [ "${{ github.event.inputs.bump }}" == "minor" ]; then
            NEW_VERSION=$(semver -i minor $CURRENT_VERSION)
          else
            NEW_VERSION=$(semver -i patch $CURRENT_VERSION)
          fi
          echo "New version: $NEW_VERSION"

          # Update version.json
          sed -i "s/\"version\": \"$CURRENT_VERSION\"/\"version\": \"$NEW_VERSION\"/" version.json

          # Update package.json in frontend directory if it exists
          if [ -f "frontend/package.json" ]; then
            sed -i "s/\"version\": \"$CURRENT_VERSION\"/\"version\": \"$NEW_VERSION\"/" frontend/package.json
          fi

          # Update package.json in backend directory if it exists
          if [ -f "be/package.json" ]; then
            sed -i "s/\"version\": \"$CURRENT_VERSION\"/\"version\": \"$NEW_VERSION\"/" be/package.json
          fi

          echo "::set-output name=new_version::$NEW_VERSION"
          echo "::set-output name=tag::v$NEW_VERSION"

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add version.json frontend/package.json be/package.json || true
          git commit -m "chore: bump version to ${{ steps.update_version.outputs.new_version }}" || echo "No changes to commit"
          git tag -a ${{ steps.update_version.outputs.tag }} -m "Release ${{ steps.update_version.outputs.tag }}"
          git push && git push --tags
