name: Generate Changelog

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [closed]
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag (e.g., v1.0.0)'
        required: true
        default: ''

jobs:
  generate-changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm install -g conventional-changelog-cli
          npm install -g @google/generative-ai

      - name: Determine version
        id: version
        run: |
          # Determine version
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="v1.0.0"
            
            # Try to get the last tag, but don't error if it doesn't exist
            LAST_TAG=$(git tag -l | sort -V | tail -n 1 || echo "")
            
            if [ -n "$LAST_TAG" ]; then
              echo "Found last tag: $LAST_TAG"
              # Auto-increment version based on commit messages
              if git log --pretty=format:%s | grep -i -E '(break|breaking|major)'; then
                # Major version bump
                MAJOR=$(echo $LAST_TAG | sed 's/v\([0-9]*\)\..*/\1/')
                NEW_MAJOR=$((MAJOR + 1))
                VERSION="v$NEW_MAJOR.0.0"
              elif git log --pretty=format:%s | grep -i -E '(feat|feature)'; then
                # Minor version bump
                MAJOR=$(echo $LAST_TAG | sed 's/v\([0-9]*\)\..*/\1/')
                MINOR=$(echo $LAST_TAG | sed 's/v[0-9]*\.\([0-9]*\)\..*/\1/')
                NEW_MINOR=$((MINOR + 1))
                VERSION="v$MAJOR.$NEW_MINOR.0"
              else
                # Patch version bump
                MAJOR=$(echo $LAST_TAG | sed 's/v\([0-9]*\)\..*/\1/')
                MINOR=$(echo $LAST_TAG | sed 's/v[0-9]*\.\([0-9]*\)\..*/\1/')
                PATCH=$(echo $LAST_TAG | sed 's/v[0-9]*\.[0-9]*\.\([0-9]*\).*/\1/')
                NEW_PATCH=$((PATCH + 1))
                VERSION="v$MAJOR.$MINOR.$NEW_PATCH"
              fi
            else
              echo "No tags found, using default version v1.0.0"
            fi
          fi

          echo "Using version: $VERSION"
          echo "::set-output name=version::$VERSION"

      - name: Generate diff summary
        id: diff_summary
        run: |
          # Create temporary files first
          DIFF_FILE=$(mktemp)
          COMMIT_FILE=$(mktemp)

          # Get all commit messages for the repository
          git log --pretty=format:"%h - %s (%an)" > "$COMMIT_FILE"

          # Check if there are any tags
          if [ -n "$(git tag -l)" ]; then
            LAST_TAG=$(git tag -l | sort -V | tail -n 1)
            echo "Found last tag: $LAST_TAG"
            # Get diff summary since last tag
            git diff --stat "$LAST_TAG" > "$DIFF_FILE" || echo "Failed to generate diff, using all files" > "$DIFF_FILE"
          else
            echo "No tags found, using summary of all files" > "$DIFF_FILE"
            git ls-files | xargs wc -l | sort -nr >> "$DIFF_FILE" || echo "Failed to list files" >> "$DIFF_FILE"
          fi

          # Create a temporary file for the AI prompt
          PROMPT_FILE=$(mktemp)
          cat << EOF > "$PROMPT_FILE"
          You are a technical writer creating a changelog for a software project.

          Please analyze the following git commit messages and diff information, then generate a detailed changelog entry.
          Focus on user-facing changes, improvements, and bug fixes.
          Categorize changes as "Added", "Changed", "Deprecated", "Removed", "Fixed", or "Security".

          Format your response as a JSON object with the following structure:
          {
            "added": ["item 1", "item 2"],
            "changed": ["item 1", "item 2"],
            "deprecated": ["item 1"],
            "removed": ["item 1"],
            "fixed": ["item 1", "item 2"],
            "security": ["item 1"]
          }

          Only include categories that have changes. If a category has no changes, omit it from the JSON.

          COMMIT MESSAGES:
          $(cat "$COMMIT_FILE")

          DIFF SUMMARY:
          $(cat "$DIFF_FILE")

          PROJECT DESCRIPTION:
          Tewen is a Prompt-Based AI Website Generator that transforms natural language descriptions into deployable websites.
          EOF

          # Use Gemini API to analyze the diff and generate a changelog entry
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "Using Gemini API for changelog generation"
            node -e "
              const { GoogleGenerativeAI } = require('@google/generative-ai');
              const fs = require('fs');
              const prompt = fs.readFileSync('$PROMPT_FILE', 'utf8');
              
              async function generateChangelog() {
                const genAI = new GoogleGenerativeAI('${{ secrets.GEMINI_API_KEY }}');
                const model = genAI.getGenerativeModel({ model: 'gemini-2.5-pro' });
                
                try {
                  const result = await model.generateContent(prompt);
                  const response = result.response.text();
                  
                  // Extract JSON from the response
                  const jsonMatch = response.match(/\{[\s\S]*\}/);
                  if (jsonMatch) {
                    console.log(jsonMatch[0]);
                    fs.writeFileSync('changelog.json', jsonMatch[0]);
                  } else {
                    console.log('{}');
                    fs.writeFileSync('changelog.json', '{}');
                  }
                } catch (error) {
                  console.error('Error generating changelog:', error);
                  fs.writeFileSync('changelog.json', '{}');
                }
              }
              
              generateChangelog();
            " || echo "{}" > changelog.json
          else
            echo "No Gemini API key available, falling back to conventional-changelog"
            echo "{}" > changelog.json
          fi

          # Clean up temporary files
          rm "$DIFF_FILE" "$COMMIT_FILE" "$PROMPT_FILE"

      - name: Generate changelog
        id: generate_changelog
        run: |
          # Check if we have AI-generated changelog
          if [ -f "changelog.json" ] && [ "$(cat changelog.json)" != "{}" ]; then
            echo "Using AI-generated changelog"
            
            # Create a temporary changelog file
            TEMP_CHANGELOG=$(mktemp)
            
            # Add header
            cat << EOF > "$TEMP_CHANGELOG"
            # Changelog

            All notable changes to this project will be documented in this file.

            The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
            and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

            ## [${{ steps.version.outputs.version }}] - $(date +%Y-%m-%d)

            EOF
            
            # Parse the JSON and add sections
            node -e "
              try {
                const fs = require('fs');
                let changelog = {};
                
                try {
                  const content = fs.readFileSync('changelog.json', 'utf8');
                  changelog = JSON.parse(content);
                } catch (err) {
                  console.error('Error parsing changelog.json:', err);
                  changelog = {};
                }
                
                const tempFile = fs.createWriteStream('$TEMP_CHANGELOG', { flags: 'a' });
                
                const sections = {
                  'added': '### Added',
                  'changed': '### Changed',
                  'deprecated': '### Deprecated',
                  'removed': '### Removed',
                  'fixed': '### Fixed',
                  'security': '### Security'
                };
                
                for (const [key, title] of Object.entries(sections)) {
                  if (changelog[key] && changelog[key].length > 0) {
                    tempFile.write(title + '\\n\\n');
                    changelog[key].forEach(item => {
                      tempFile.write('- ' + item + '\\n');
                    });
                    tempFile.write('\\n');
                  }
                }
                
                tempFile.end();
              } catch (error) {
                console.error('Error in changelog generation:', error);
              }
            " || echo "Failed to process changelog JSON"
            
            # Add the unreleased section from the existing changelog
            if [ -f "CHANGELOG.md" ]; then
              sed -n '/^## \[Unreleased\]/,/^## \[/p' CHANGELOG.md | sed '/^## \[/d' >> "$TEMP_CHANGELOG" || true
            fi
            
            # Replace the existing changelog
            mv "$TEMP_CHANGELOG" CHANGELOG.md
          else
            echo "Using conventional-changelog"
            
            # Generate changelog using conventional-changelog
            if [ ! -f "CHANGELOG.md" ]; then
              conventional-changelog -p angular -i CHANGELOG.md -s -r 0 || echo "Failed to generate conventional changelog"
            else
              conventional-changelog -p angular -i CHANGELOG.md -s || echo "Failed to update conventional changelog"
            fi
          fi

          # Set output for the next step
          echo "::set-output name=changelog_path::CHANGELOG.md"

      - name: Commit and push changelog
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add CHANGELOG.md
          git commit -m "chore: update changelog for ${{ steps.version.outputs.version }}" || echo "No changes to commit"
          git push
