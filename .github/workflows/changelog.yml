name: Generate Changelog

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [closed]
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag (e.g., v1.0.0)'
        required: true
        default: ''

jobs:
  generate-changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm install -g conventional-changelog-cli
          npm install -g @anthropic-ai/sdk
          npm install -g openai
          npm install -g @google/generative-ai

      - name: Determine version
        id: version
        run: |
          # Determine version
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # Auto-increment version based on commit messages
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            
            # Check commit messages for keywords to determine version bump
            if git log $LAST_TAG..HEAD --pretty=format:%s | grep -i -E '(break|breaking|major)'; then
              # Major version bump
              MAJOR=$(echo $LAST_TAG | sed 's/v\([0-9]*\)\..*/\1/')
              NEW_MAJOR=$((MAJOR + 1))
              VERSION="v$NEW_MAJOR.0.0"
            elif git log $LAST_TAG..HEAD --pretty=format:%s | grep -i -E '(feat|feature)'; then
              # Minor version bump
              MAJOR=$(echo $LAST_TAG | sed 's/v\([0-9]*\)\..*/\1/')
              MINOR=$(echo $LAST_TAG | sed 's/v[0-9]*\.\([0-9]*\)\..*/\1/')
              NEW_MINOR=$((MINOR + 1))
              VERSION="v$MAJOR.$NEW_MINOR.0"
            else
              # Patch version bump
              MAJOR=$(echo $LAST_TAG | sed 's/v\([0-9]*\)\..*/\1/')
              MINOR=$(echo $LAST_TAG | sed 's/v[0-9]*\.\([0-9]*\)\..*/\1/')
              PATCH=$(echo $LAST_TAG | sed 's/v[0-9]*\.[0-9]*\.\([0-9]*\).*/\1/')
              NEW_PATCH=$((PATCH + 1))
              VERSION="v$MAJOR.$MINOR.$NEW_PATCH"
            fi
          fi

          echo "Using version: $VERSION"
          echo "::set-output name=version::$VERSION"

      - name: Generate diff summary
        id: diff_summary
        run: |
          # Get the last tag or use a default
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")

          # Generate a detailed diff summary
          echo "Generating diff summary from $LAST_TAG to HEAD"

          # Create a temporary file for the diff
          DIFF_FILE=$(mktemp)
          git diff $LAST_TAG..HEAD > $DIFF_FILE

          # Create a temporary file for commit messages
          COMMIT_FILE=$(mktemp)
          git log $LAST_TAG..HEAD --pretty=format:"%h - %s (%an)" > $COMMIT_FILE

          # Create a temporary file for the AI prompt
          PROMPT_FILE=$(mktemp)
          cat << EOF > $PROMPT_FILE
          You are a technical writer creating a changelog for a software project.

          Please analyze the following git diff and commit messages, then generate a detailed changelog entry.
          Focus on user-facing changes, improvements, and bug fixes.
          Categorize changes as "Added", "Changed", "Deprecated", "Removed", "Fixed", or "Security".

          Format your response as a JSON object with the following structure:
          {
            "added": ["item 1", "item 2"],
            "changed": ["item 1", "item 2"],
            "deprecated": ["item 1"],
            "removed": ["item 1"],
            "fixed": ["item 1", "item 2"],
            "security": ["item 1"]
          }

          Only include categories that have changes. If a category has no changes, omit it from the JSON.

          COMMIT MESSAGES:
          $(cat $COMMIT_FILE)

          DIFF SUMMARY:
          $(git diff --stat $LAST_TAG..HEAD)

          DIFF DETAILS:
          $(cat $DIFF_FILE | head -n 1000)
          EOF

          # Use Claude API to analyze the diff and generate a changelog entry
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "Using Claude API for changelog generation"
            CHANGELOG_JSON=$(node -e "
              const { Anthropic } = require('@anthropic-ai/sdk');
              const fs = require('fs');
              const prompt = fs.readFileSync('$PROMPT_FILE', 'utf8');
              
              async function generateChangelog() {
                const anthropic = new Anthropic({
                  apiKey: '${{ secrets.ANTHROPIC_API_KEY }}'
                });
                
                const message = await anthropic.messages.create({
                  model: 'claude-3-5-sonnet-20241022',
                  max_tokens: 4000,
                  messages: [
                    {
                      role: 'user',
                      content: prompt
                    }
                  ]
                });
                
                // Extract JSON from the response
                const response = message.content[0].text;
                const jsonMatch = response.match(/\{[\s\S]*\}/);
                if (jsonMatch) {
                  console.log(jsonMatch[0]);
                } else {
                  console.log('{}');
                }
              }
              
              generateChangelog().catch(console.error);
            ")
          # Fallback to OpenAI if Claude is not available
          elif [ -n "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "Using OpenAI API for changelog generation"
            CHANGELOG_JSON=$(node -e "
              const OpenAI = require('openai');
              const fs = require('fs');
              const prompt = fs.readFileSync('$PROMPT_FILE', 'utf8');
              
              async function generateChangelog() {
                const openai = new OpenAI({
                  apiKey: '${{ secrets.OPENAI_API_KEY }}'
                });
                
                const response = await openai.chat.completions.create({
                  model: 'gpt-4o',
                  messages: [
                    {
                      role: 'user',
                      content: prompt
                    }
                  ],
                  response_format: { type: 'json_object' }
                });
                
                console.log(response.choices[0].message.content);
              }
              
              generateChangelog().catch(console.error);
            ")
          # Fallback to Gemini if neither Claude nor OpenAI is available
          elif [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "Using Gemini API for changelog generation"
            CHANGELOG_JSON=$(node -e "
              const { GoogleGenerativeAI } = require('@google/generative-ai');
              const fs = require('fs');
              const prompt = fs.readFileSync('$PROMPT_FILE', 'utf8');
              
              async function generateChangelog() {
                const genAI = new GoogleGenerativeAI('${{ secrets.GEMINI_API_KEY }}');
                const model = genAI.getGenerativeModel({ model: 'gemini-2.5-pro' });
                
                const result = await model.generateContent(prompt);
                const response = result.response.text();
                
                // Extract JSON from the response
                const jsonMatch = response.match(/\{[\s\S]*\}/);
                if (jsonMatch) {
                  console.log(jsonMatch[0]);
                } else {
                  console.log('{}');
                }
              }
              
              generateChangelog().catch(console.error);
            ")
          else
            echo "No AI API keys available, falling back to conventional-changelog"
            CHANGELOG_JSON="{}"
          fi

          # Clean up temporary files
          rm $DIFF_FILE $COMMIT_FILE $PROMPT_FILE

          # Save the JSON to a file
          echo "$CHANGELOG_JSON" > changelog.json

          # Set output for the next step
          echo "::set-output name=changelog_json::$CHANGELOG_JSON"

      - name: Generate changelog
        id: generate_changelog
        run: |
          # Check if we have AI-generated changelog
          if [ -f "changelog.json" ] && [ "$(cat changelog.json)" != "{}" ]; then
            echo "Using AI-generated changelog"
            
            # Create a temporary changelog file
            TEMP_CHANGELOG=$(mktemp)
            
            # Add header
            cat << EOF > $TEMP_CHANGELOG
            # Changelog

            All notable changes to this project will be documented in this file.

            The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
            and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

            ## [${{ steps.version.outputs.version }}] - $(date +%Y-%m-%d)

            EOF
            
            # Parse the JSON and add sections
            node -e "
              const fs = require('fs');
              const changelog = JSON.parse(fs.readFileSync('changelog.json', 'utf8'));
              const tempFile = fs.createWriteStream('$TEMP_CHANGELOG', { flags: 'a' });
              
              const sections = {
                'added': '### Added',
                'changed': '### Changed',
                'deprecated': '### Deprecated',
                'removed': '### Removed',
                'fixed': '### Fixed',
                'security': '### Security'
              };
              
              for (const [key, title] of Object.entries(sections)) {
                if (changelog[key] && changelog[key].length > 0) {
                  tempFile.write(title + '\\n\\n');
                  changelog[key].forEach(item => {
                    tempFile.write('- ' + item + '\\n');
                  });
                  tempFile.write('\\n');
                }
              }
              
              tempFile.end();
            "
            
            # Add the unreleased section from the existing changelog
            if [ -f "CHANGELOG.md" ]; then
              sed -n '/^## \[Unreleased\]/,/^## \[/p' CHANGELOG.md | sed '/^## \[/d' >> $TEMP_CHANGELOG
            fi
            
            # Replace the existing changelog
            mv $TEMP_CHANGELOG CHANGELOG.md
          else
            echo "Using conventional-changelog"
            
            # Generate changelog using conventional-changelog
            if [ ! -f "CHANGELOG.md" ]; then
              conventional-changelog -p angular -i CHANGELOG.md -s -r 0
            else
              conventional-changelog -p angular -i CHANGELOG.md -s
            fi
          fi

          # Set output for the next step
          echo "::set-output name=changelog_path::CHANGELOG.md"

      - name: Commit and push changelog
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add CHANGELOG.md
          git commit -m "chore: update changelog for ${{ steps.version.outputs.version }}" || echo "No changes to commit"
          git push
